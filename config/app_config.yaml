system:
  name: "SatQuery AI"
  version: "1.0.0"
  environment: "development"
  log_level: "INFO"

runtime:
  mode: "real"        # Loads local adapted checkpoints when dependencies and base weights are available
  device: "auto"      # "auto", "cuda", "cpu"
  vram_budget_gb: 8.0
  quantization: "int4" # "int8", "int4", "bf16", "fp32"
  fallback_to_cpu: true
  deterministic: true
  random_seed: 42
  timeout_seconds: 60
  allow_model_downloads: false
  base_model_path: "models/InternVL2-4B"

storage:
  root_dir: "sessions"
  max_sessions: 100
  max_storage_gb: 10.0
  artifact_cleanup_hours: 24

model_store:
  weights_dir: "models"
  earthdial_model_path: "models/earthdial"
  dofa_model_path: "models/dofa_hf"
  earthdial_bigearthnet_model_path: "models/earthdial_bigearthnet_hf"
  earthdial_base_model_path: "models/InternVL2-4B"

reports:
  output_format: "html"
  include_overlays: true
  include_trace: true
